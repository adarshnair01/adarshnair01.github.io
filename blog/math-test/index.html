               <h1>The Math Behind Machine Learning</h1>
               <p>Exploring the fundamental equations that power data science.</p>
               <h1>Mathematical Foundations</h1>
<p>Data science relies heavily on mathematical concepts. Here are a few key examples formatted beautifully in this journal.</p>
<h2>Linear Regression</h2>
<p>The simple linear regression model is defined as:</p>
<p>$ Y = \beta_0 + \beta_1 X + \epsilon $</p>
<p>Where:</p>
<ul>
<li>$Y$ is the dependent variable</li>
<li>$X$ is the independent variable</li>
<li>$\beta_0$ is the intercept</li>
<li>$\beta_1$ is the slope</li>
<li>$\epsilon$ is the error term</li>
</ul>
<h2>The Normal Distribution</h2>
<p>The probability density function of the normal distribution is given by:</p>
<p>$ f(x) = \frac{1}{\sigma\sqrt{2\pi}} e^{-\frac{1}{2}\left(\frac{x-\mu}{\sigma}\right)^2} $</p>
<h2>Neural Network Activation</h2>
<p>The Sigmoid activation function, commonly used in neural networks:</p>
<p>$ \sigma(z) = \frac{1}{1 + e^{-z}} $</p>
<h2>Matrix Multiplication</h2>
<p>Let $A$ be an $m \times n$ matrix and $B$ be an $n \times p$ matrix:</p>
<p>$ (AB)<em>{ij} = \sum</em>{k=1}^n A_{ik}B_{kj} $</p>
